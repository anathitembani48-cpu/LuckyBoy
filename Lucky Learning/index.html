<!DOCTYPE html>
<html>
<head>
  <title>KiddosLearn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { text-align: center; padding: 40px; font-family: Arial; background: #FFF9C4; }
    button { font-size: 60px; padding: 30px; margin: 15px; border-radius: 20px; background: #FFD93D; border: none; }
  </style>
</head>
<body>
  <h1>KiddosLearn 🎓</h1>
  <h2>Tap a number to hear it!</h2>
  <button onclick="speak('One')">1 🔊</button>
  <button onclick="speak('Two')">2 🔊</button>
  <button onclick="speak('Three')">3 🔊</button>
  <button onclick="speak('Four')">4 🔊</button>
  <button onclick="speak('Five')">5 🔊</button>

  <script>
    function speak(word) {
      const msg = new SpeechSynthesisUtterance(word)
      msg.lang = 'en-US'
      window.speechSynthesis.speak(msg)
    }
  </script>
</body>
</html>
