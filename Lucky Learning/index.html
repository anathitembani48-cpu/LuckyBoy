<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiddoLearn Numbers</title>
  <style>
    body {
      font-family: 'Comic Sans MS', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: white;
      font-size: 2rem;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
   .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      max-width: 500px;
      width: 100%;
    }
    button {
      aspect-ratio: 1;
      font-size: 2.5rem;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      background: white;
      color: #667eea;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.9);
      background: #ffe66d;
    }
  </style>
</head>
<body>
  <h1>Learn Numbers 1-10 🔊</h1>
  <div class="grid">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>10</button>
  </div>

  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel(); // stop previous sound
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        msg.rate = 0.8; // slower for kids
        speechSynthesis.speak(msg);
      } else {
        alert('Voice not supported on this phone');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          speak(btn.innerText);
        });
      });
    });
  </script>
</body>
</html>
